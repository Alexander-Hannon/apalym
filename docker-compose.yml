services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./apps/api:/app

  ai:
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
    env_file: .env
    ports:
      - "${AI_PORT}:8001"
    depends_on:
      - redis
    volumes:
      - ./apps/ai:/app

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file: .env
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      - api
      - ai
    volumes:
      - ./apps/web:/app

volumes:
  db_data:
